<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen — X</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --bg:           #08090B;
    --surface:      #0F1013;
    --surface-2:    #161719;
    --border:       #1F2124;
    --border-mid:   #2A2D32;
    --text:         #F5F5F5;
    --text-muted:   #64676F;
    --text-dim:     #28292D;
    --accent:       #DFFF47;
    --accent-dark:  #B8D930;
    --accent-dim:   #1B2700;
    --accent-text:  #08090B;

    --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --font-body:    'IBM Plex Sans', system-ui, sans-serif;
    --font-mono:    'IBM Plex Mono', 'Courier New', monospace;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:           #F4F4EF;
      --surface:      #FFFFFF;
      --surface-2:    #EEEEE9;
      --border:       #DCDCD6;
      --border-mid:   #CACAC4;
      --text:         #0A0A0C;
      --text-muted:   #64676F;
      --text-dim:     #C8C8C2;
      --accent:       #5C8C00;
      --accent-dark:  #4A7000;
      --accent-dim:   #EBF5D0;
      --accent-text:  #FFFFFF;
    }
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-weight: 300;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    height: 100svh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    padding: 14px clamp(16px, 4vw, 40px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
  }

  .brand-x {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .brand-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .btn-ghost {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 6px 0;
    transition: color 0.15s;
  }

  .btn-ghost:hover { color: var(--text); }

  .intro {
    flex-shrink: 0;
    padding: 14px clamp(16px, 4vw, 40px);
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--text-muted);
    max-width: 780px;
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px clamp(16px, 4vw, 40px) 8px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    max-width: 100%;
  }

  .msg-user { justify-content: flex-end; }
  .msg-assistant { justify-content: flex-start; }
  .msg-system { justify-content: center; }

  .bubble {
    max-width: min(640px, 82%);
    padding: 12px 16px;
    border-radius: 4px;
    font-size: 14.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg-user .bubble {
    background: var(--accent-dim);
    border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
    color: var(--text);
  }

  .msg-assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .msg-system .bubble {
    background: transparent;
    border: 1px dashed var(--border-mid);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
  }

  .typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 2px;
  }

  .typing span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: blink 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; }
    40% { opacity: 1; }
  }

  .composer {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    padding: 14px clamp(16px, 4vw, 40px) calc(16px + env(safe-area-inset-bottom));
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #input {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border-mid);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14.5px;
    font-weight: 300;
    line-height: 1.5;
    padding: 12px 14px;
    outline: none;
    resize: none;
    max-height: 160px;
    min-height: 44px;
    transition: border-color 0.15s;
  }

  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--text-dim); }

  #send {
    flex-shrink: 0;
    background: var(--accent);
    color: var(--accent-text);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    border: none;
    padding: 13px 22px;
    cursor: pointer;
    transition: background 0.15s;
  }

  #send:hover:not(:disabled) { background: var(--accent-dark); }
  #send:disabled { opacity: 0.4; cursor: default; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>

<header>
  <a class="brand" href="/">
    <span class="brand-x">X /</span>
    <span class="brand-name">Listen</span>
  </a>
  <div class="header-actions">
    <button class="btn-ghost" id="clearBtn" type="button">New conversation</button>
  </div>
</header>

<div class="intro">
  Talk however you need to — vent, ramble, think out loud. This isn't therapy and it won't perform concern at you.
  If you ever want real help fast, just say so and it'll help you get there.
</div>

<main id="messages" aria-live="polite"></main>

<form class="composer" id="composer">
  <textarea id="input" placeholder="Say whatever's going on…" rows="1" autofocus></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
  const STORAGE_KEY = 'listen_chat_history_v1';
  const messagesEl = document.getElementById('messages');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const clearBtn = document.getElementById('clearBtn');

  let history = loadHistory();
  render();

  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch {
      // storage unavailable (private browsing, quota) — conversation just won't persist
    }
  }

  function render() {
    messagesEl.innerHTML = '';
    for (const msg of history) {
      messagesEl.appendChild(renderMessage(msg));
    }
    scrollToBottom();
  }

  function renderMessage(msg) {
    const row = document.createElement('div');
    row.className = 'msg msg-' + msg.role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.content;
    row.appendChild(bubble);
    return row;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  input.addEventListener('input', autoResize);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  clearBtn.addEventListener('click', () => {
    if (history.length === 0) return;
    if (!confirm('Start a new conversation? This clears what you’ve said so far on this device.')) return;
    history = [];
    saveHistory();
    render();
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    history.push({ role: 'user', content: text });
    saveHistory();
    render();

    input.value = '';
    autoResize();
    setBusy(true);

    const typingRow = renderTyping();
    messagesEl.appendChild(typingRow);
    scrollToBottom();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json();

      typingRow.remove();

      if (!res.ok) {
        history.push({ role: 'system', content: data.error || 'Something went wrong. Try again.' });
      } else {
        history.push({ role: 'assistant', content: data.reply || '…' });
      }
    } catch (err) {
      typingRow.remove();
      history.push({ role: 'system', content: 'Couldn’t reach the server. Check your connection and try again.' });
    }

    saveHistory();
    render();
    setBusy(false);
    input.focus();
  });

  function renderTyping() {
    const row = document.createElement('div');
    row.className = 'msg msg-assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(bubble);
    return row;
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    input.disabled = busy;
  }
</script>

</body>
</html>
